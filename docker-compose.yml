name: axisrelay

services:
  axisrelay:
    image: ghcr.io/wuekevin/axisrelay:latest
    container_name: axisrelay
    ports:
      - "${AXISRELAY_BIND_HOST:-0.0.0.0}:${AXISRELAY_PORT:-8080}:${AXISRELAY_PORT:-8080}"
    env_file:
      - .env
    volumes:
      - image-assets:/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${AXISRELAY_PORT:-8080}/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s
    stop_grace_period: 60s
    restart: unless-stopped
    networks:
      - axisrelay-net

  redis:
    image: redis:7-alpine
    container_name: axisrelay-redis
    command: redis-server --appendonly yes
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - redisdata:/data
    # ports:
    #   - "6379:6379"   # 取消注释以便本地调试
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - axisrelay-net

networks:
  axisrelay-net:
    driver: bridge

volumes:
  redisdata:
    name: axisrelay_redisdata
  image-assets:
    name: axisrelay_image-assets
