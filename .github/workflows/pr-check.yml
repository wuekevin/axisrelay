name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
  push:
    branches:
      - main
      - codex/**
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Install Chromium for SVG export regression tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test SVG export in the browser
        working-directory: frontend
        run: npm run test:svg

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ github.head_ref || github.ref_name }}
        run: npm run build

  golangci-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/placeholder

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --enable-only=govet --timeout=10m ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: axisrelay_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -paxisrelay_test --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AXISRELAY_TEST_MYSQL_ROOT_DSN: root:axisrelay_test@tcp(127.0.0.1:3306)/
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/placeholder

      - name: Run Go tests
        run: go test ./... -p 1 -count=1 -timeout 20m

  test-race:
    name: test-race (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: proxy-a-g
          - name: proxy-h-z
          - name: admin
          - name: database
          - name: promptfilter
          - name: rest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: axisrelay_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -paxisrelay_test --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AXISRELAY_TEST_MYSQL_ROOT_DSN: root:axisrelay_test@tcp(127.0.0.1:3306)/
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/placeholder

      # 重包各占一台 2 核 runner,避免互相抢核。分片大小见 go-race-packages.sh:
      # 测试建库通过 AXISRELAY_TEST_MYSQL_ROOT_DSN 在 MySQL 8.0 中创建隔离 schema;
      # admin/database 各自独占分片,proxy 是最重的包,按测试名首字母拆两片。
      - name: Run Go tests with race detector
        run: |
          set -euo pipefail
          args="$(bash .github/scripts/go-race-packages.sh '${{ matrix.name }}')"
          # shellcheck disable=SC2086
          go test -race -count=1 -timeout 12m $args
