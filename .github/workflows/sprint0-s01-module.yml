name: Sprint 0 - S0.1 Module Namespace

on:
  push:
    branches:
      - feat/axisrelay-sprint0
    paths:
      - .github/workflows/sprint0-s01-module.yml

permissions:
  contents: write

jobs:
  migrate-module:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sprint 0 branch
        uses: actions/checkout@v4
        with:
          ref: feat/axisrelay-sprint0
          fetch-depth: 0

      - name: Replace Go module namespace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")
          old = "github.com/codex2api"
          new = "github.com/wuekevin/axisrelay"
          skip_dirs = {".git", "node_modules", "dist", "vendor"}
          skip_files = {"CHANGELOG.md"}
          binary_suffixes = {
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".woff", ".woff2",
              ".ttf", ".otf", ".zip", ".gz", ".tar", ".pdf", ".db", ".sqlite"
          }

          changed = []
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              rel = path.as_posix()
              if rel.startswith("./"):
                  rel = rel[2:]
              if any(part in skip_dirs for part in path.parts):
                  continue
              if rel in skip_files or path.suffix.lower() in binary_suffixes:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if old not in text:
                  continue
              path.write_text(text.replace(old, new), encoding="utf-8")
              changed.append(rel)

          print(f"updated {len(changed)} files")
          for rel in changed:
              print(rel)
          PY

      - name: Tidy Go module
        run: go mod tidy

      - name: Verify old module namespace is gone
        shell: bash
        run: |
          if grep -R --line-number --exclude=CHANGELOG.md --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist 'github.com/codex2api' .; then
            echo "Old module namespace still exists"
            exit 1
          fi
          test "$(head -n 1 go.mod)" = "module github.com/wuekevin/axisrelay"

      - name: Run Go tests
        run: go test ./...

      - name: Commit and push S0.1
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No module namespace changes to commit"
            exit 0
          fi
          git config user.name "axisrelay-sprint0"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: migrate Go module namespace to AxisRelay [S0.1]"
          git push origin HEAD:feat/axisrelay-sprint0
