name: codex2api-sqlite

services:
  codex2api:
    image: ghcr.io/james-6-23/codex2api:latest
    container_name: codex2api-sqlite
    ports:
      # Bind to localhost only by default for security.
      # To expose on all interfaces, set AXISRELAY_BIND_HOST=0.0.0.0 in .env or override here.
      - "${AXISRELAY_BIND_HOST:-127.0.0.1}:${AXISRELAY_PORT:-8080}:${AXISRELAY_PORT:-8080}"
    env_file:
      - .env
    volumes:
      - sqlite-data:/data
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  sqlite-data:
    name: codex2api-sqlite_sqlite-data
