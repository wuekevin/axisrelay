name: axisrelay-local

services:
  axisrelay:
    build: .
    container_name: axisrelay
    ports:
      - "${AXISRELAY_BIND_HOST:-0.0.0.0}:${AXISRELAY_PORT:-8080}:${AXISRELAY_PORT:-8080}"
    env_file:
      - .env
    volumes:
      - image-assets:/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - axisrelay-net

  redis:
    image: redis:7-alpine
    container_name: axisrelay-redis
    command: redis-server --appendonly yes
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - redisdata:/data
    # ports:
    #   - "6379:6379"   # 取消注释以便本地调试
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - axisrelay-net

networks:
  axisrelay-net:
    driver: bridge

volumes:
  redisdata:
    name: axisrelay-local_redisdata
  image-assets:
    name: axisrelay-local_image-assets
